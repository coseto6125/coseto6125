name: Update README cards

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=coseto6125&custom_title=E-NoR%27s%20Public%20Repository%20Stats&show_icons=true&hide_border=true&card_width=420&bg_color=0f172a&title_color=67e8f9&icon_color=2dd4bf&text_color=cbd5e1&ring_color=14b8a6
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=coseto6125&custom_title=Languages%20in%20Public%20Repositories&layout=compact&card_width=420&hide=html&hide_border=true&bg_color=0f172a&title_color=67e8f9&text_color=cbd5e1&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test activity graph renderer
        working-directory: scripts
        run: python test_activity_graph.py

      - name: Generate contribution activity graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/activity_graph.py coseto6125 profile/activity.svg

      - name: Normalize top languages card dimensions
        run: python scripts/normalize_card.py profile/top-langs.svg

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "chore: update README stats cards"
          git push
